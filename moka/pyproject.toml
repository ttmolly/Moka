[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moka"
version = "0.1.0"
description = "Linux ONNX Runtime backend for Laya typed-decision models, with a live Snake demo"
keywords = ["onnxruntime", "laya", "decision-model", "linux", "local-ai", "typed-decisions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.19,<2",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.34,<2",
  "safetensors>=0.6",
]

[project.optional-dependencies]
convert = ["torch>=2.4,<3", "onnx>=1.16"]
cuda = ["onnxruntime-gpu>=1.19,<2"]
openvino = ["onnxruntime-openvino>=1.19,<2"]
dev = ["pytest>=8", "ruff>=0.12"]
demo = ["rich>=13"]

[project.scripts]
moka = "moka.cli:main"
moka-snake = "moka.snake.cli:main"

[project.urls]
Repository = "https://github.com/moka-infer/moka"
Upstream = "https://github.com/NandhaKishorM/laya"
PriorArt = "https://github.com/mizorewww/laya-coreml"
Documentation = "https://github.com/moka-infer/moka#readme"

[tool.hatch.build.targets.wheel]
packages = ["moka"]

[tool.hatch.build.targets.sdist]
include = ["/moka", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".git", ".ruff_cache", "artifacts", "benchmarks"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
